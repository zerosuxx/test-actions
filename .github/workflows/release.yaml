name: deploy-backend-service

on:
  push:
    branches:
      - main
    tags:
      - '**'
    paths:
      - 'projects/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ROOT: backend-service
  SLOT_NAME: staging

jobs:
  resolve-environments:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.resolve.outputs.environments }}
    steps:
      - name: Resolve target environments
        id: resolve
        env:
          DEV_ENV_LIST: '["dev"]'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            env_name="${GITHUB_REF_NAME%%/*}"
            environments="[\"${env_name}\"]"
          else
            environments="$DEV_ENV_LIST"
          fi
          echo "environments=${environments}" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: resolve-environments
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.environment }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.resolve-environments.outputs.environments) }}
    environment: ${{ matrix.environment }}
    steps:
      - run: echo ${{ matrix.environment }}
