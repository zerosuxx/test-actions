name: Build

on: 
  push:
  workflow_dispatch:

env:
  IMAGE_TAG: '2.7.99-enhanced.1'

jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v5
        with:
          repository: 'zerosuxx/sftpgo'
          ref: ${{ env.IMAGE_TAG }}


      - name: Install bws
        uses: jdx/mise-action@v4
        with:
          tool_versions: |
            bitwarden-secrets-manager@2.1.0
          reshim: true
          cache: false

      - run: bws --version
