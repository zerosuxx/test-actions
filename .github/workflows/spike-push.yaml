name: Build

on: 
  push:
  workflow_dispatch:

env:
  IMAGE_TAG: '2.7.99-enhanced.1'

jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v5
        with:
          repository: 'zerosuxx/sftpgo'
          ref: ${{ env.IMAGE_TAG }}


      - name: Install bws
        uses: jdx/mise-action@v4
        with:
          tool_versions: |
            bitwarden-secrets-manager 2.1.0
          reshim: true
          cache: false

      - name: Debug bws
        shell: bash
        run: |
          echo "PATH=$PATH"
          echo "---- mise ls ----"
          mise ls
          echo "---- mise which ----"
          mise which bws || true
          echo "---- mise exec ----"
          mise exec -- bws --version || true
          echo "---- command -v ----"
          command -v bws || true
          echo "---- shim ----"
          ls -la ~/.local/share/mise/shims/bws 2>&1 || true
